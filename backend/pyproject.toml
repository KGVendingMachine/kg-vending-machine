[project]
name = "backend"
version = "0.1.0"
description = "KG Vending Machine backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.0",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "langchain-core>=1.4.8",
    "olefile>=0.47",
    "openai>=2.44.0",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
