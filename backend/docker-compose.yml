services:
  backend:
    build: .
    container_name: kg-vending-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - kg_vending_chroma:/app/data/chroma
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: kg-vending-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kg_vending}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kg_vending_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kg_vending}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kg_vending_pgdata:
  kg_vending_chroma:
