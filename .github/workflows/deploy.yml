name: Deploy Backend

# main이 develop보다 크게 뒤처져 있어 아직 운영 브랜치로 쓰이지 않는다.
# main을 실제로 쓰기 시작하면 트리거 브랜치를 반드시 여기서 바꿀 것 (xuswns/cicd-guide.md 참고).
on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
  # Actions 탭 > Deploy Backend > Run workflow 버튼(또는 gh workflow run)으로
  # 수동 실행. 워크플로 파일만 바뀐 푸시는 paths 필터에 안 걸려 배포가 안 도는데,
  # 그런 경우에도 이걸로 배포·마이그레이션을 돌릴 수 있다.
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_DEPLOY_PATH }}/backend
            git fetch origin develop
            git reset --hard origin/develop
            docker compose -f docker-compose.prod.yml build
            # 운영 DB 먼저 실행
            docker compose -f docker-compose.prod.yml up -d --wait postgres

            # 운영 DB에 Alembic 적용
            docker compose -f docker-compose.prod.yml run --rm backend \
              uv run --no-sync alembic upgrade head
              
            # 마이그레이션 성공 후 새 백엔드 실행
            docker compose -f docker-compose.prod.yml up -d backend
            docker image prune -f
